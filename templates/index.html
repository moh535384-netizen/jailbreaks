<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Qwen Chat</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0f1115;color:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app{max-width:820px;margin:auto;height:100dvh;display:flex;flex-direction:column}
    header{padding:18px 16px;border-bottom:1px solid #262a33;font-weight:700}
    #chat{flex:1;overflow:auto;padding:18px 14px}
    .msg{max-width:86%;padding:12px 14px;margin:8px 0;border-radius:16px;white-space:pre-wrap;line-height:1.55}
    .user{margin-right:auto;background:#6d5dfc;color:white}
    .assistant{margin-left:auto;background:#1c2028}
    form{display:flex;gap:8px;padding:12px;background:#0f1115;border-top:1px solid #262a33}
    textarea{flex:1;resize:none;min-height:48px;max-height:140px;border:1px solid #343946;border-radius:14px;background:#171a21;color:white;padding:13px;font:inherit}
    button{border:0;border-radius:14px;padding:0 18px;background:#6d5dfc;color:white;font-weight:700}
    button:disabled{opacity:.5}
  </style>
</head>
<body>
<div class="app">
  <header>Qwen3-8B • RunPod</header>
  <main id="chat"></main>
  <form id="form">
    <textarea id="input" placeholder="اكتب رسالتك..." required></textarea>
    <button id="send">إرسال</button>
  </form>
</div>

<script>
const chat=document.getElementById('chat');
const form=document.getElementById('form');
const input=document.getElementById('input');
const send=document.getElementById('send');

let messages=[];

function bubble(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}

form.addEventListener('submit',async e=>{
  e.preventDefault();

  const text=input.value.trim();
  if(!text)return;

  messages.push({role:'user',content:text});
  bubble('user',text);

  input.value='';
  send.disabled=true;

  const wait=bubble('assistant','...');

  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages})
    });

    const data=await r.json();

    if(!r.ok)
      throw new Error(data.error || 'Request failed');

    wait.textContent=data.reply || '(رد فارغ)';
    messages.push({
      role:'assistant',
      content:data.reply || ''
    });

  }catch(err){
    wait.textContent='خطأ: '+err.message;
  }finally{
    send.disabled=false;
    input.focus();
  }
});
</script>
</body>
</html>
